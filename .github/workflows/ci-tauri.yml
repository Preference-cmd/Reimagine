name: ci-tauri

on:
  push:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'CHANGELOG.md'
      - 'lefthook.yml'
      - '.github/**'
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'src-tauri/**'
      - 'ui/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'deny.toml'
      - 'CHANGELOG.md'
      - 'lefthook.yml'
      - '.github/**'
  workflow_dispatch:

# A new push to a pull request cancels its older run. Every other run (pushes
# to main, manual dispatches) gets a group of its own, so none is cancelled.
concurrency:
  group: ci-tauri-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  quality:
    name: quality (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: ubuntu-24.04
          - platform: macos
            runner: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            wget

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: .
          shared-key: tauri-${{ matrix.platform }}

      - name: Setup Bun
        if: matrix.platform == 'linux'
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Cache Bun global store
        if: matrix.platform == 'linux'
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        if: matrix.platform == 'linux'
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Type-check and build frontend
        if: matrix.platform == 'linux'
        working-directory: ui
        run: bun run build

      - name: Module layout guard
        if: matrix.platform == 'linux'
        run: python3 .github/scripts/check-module-layout.py

      - name: Rust format check
        if: matrix.platform == 'linux'
        run: cargo fmt --all -- --check

      - name: Rust check
        if: matrix.platform == 'linux'
        # ci-workers owns burn-worker compilation; exclude from generic check
        run: >
          cargo check
          --workspace --all-targets --locked
          --exclude reimagine-inference-burn-worker

      - name: Kernel-only check
        if: matrix.platform == 'linux'
        run: >
          cargo check
          --locked --no-default-features
          -p reimagine-app-host -p reimagine-axum-host -p reimagine

      - name: Rust clippy
        if: matrix.platform == 'linux'
        run: >
          cargo clippy
          --workspace --all-targets --locked
          --exclude reimagine-inference-burn-worker
          -- -D warnings

      - name: Rust tests (non-Burn)
        # Worker tests have feature-specific boundaries and are owned by
        # ci-workers. Burn is tested separately with a runner-appropriate
        # backend so no-GPU Linux hosts never execute WGPU compute tests.
        run: >
          cargo test
          --workspace
          --exclude reimagine
          --exclude reimagine-inference-burn
          --exclude reimagine-inference-burn-worker
          --locked

      - name: Burn tests (Flex CPU)
        if: matrix.platform == 'linux'
        run: >
          cargo test
          -p reimagine-inference-burn
          --lib --locked
          --no-default-features --features flex

      - name: Burn tests (WGPU Metal)
        if: matrix.platform == 'macos'
        run: >
          cargo test
          -p reimagine-inference-burn
          --lib --locked

  ui-static:
    name: ui-static
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Lint frontend
        working-directory: ui
        run: bun run lint

      - name: Check frontend formatting
        working-directory: ui
        run: bun run format:check

      - name: Frontend tests
        working-directory: ui
        run: bun run test:run

  compile:
    name: tauri-compile (${{ matrix.platform }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            runner: macos-latest
          - platform: linux
            runner: ubuntu-24.04
          - platform: windows
            runner: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Tauri system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            wget

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: .
          shared-key: tauri-${{ matrix.platform }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Cache Bun global store
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: ui
        run: bun install --frozen-lockfile

      - name: Compile Tauri application
        uses: tauri-apps/tauri-action@v1
        with:
          args: --no-bundle

  guards:
    name: guards
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Rust 1.96
        uses: dtolnay/rust-toolchain@1.96

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: .
          shared-key: guards

      - name: Module layout
        run: python3 .github/scripts/check-module-layout.py

      - name: Dependency directions
        run: bash .github/scripts/check-dependency-directions.sh

      - name: Dependency policy (cargo-deny)
        # Advisories, licenses, bans and sources, configured in deny.toml.
        uses: EmbarkStudios/cargo-deny-action@v2

      - name: Breaking commits update CHANGELOG.md
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/check-commit-messages.py range "$BASE" "$HEAD"
