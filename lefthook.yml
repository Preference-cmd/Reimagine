# Git hooks (lefthook). Keep these local checkpoints fast; CI owns the full gate
# matrix (AGENTS.md Commands). Every file called here is tracked: .github/scripts/
# holds the gates. Nothing here references the machine-local trees (scripts/,
# .agents/, docs/); those checks live in the gitignored lefthook-local.yml, which
# lefthook merges into this file at run time.
# Install: brew install lefthook && lefthook install (or: bunx lefthook install).

glob_matcher: doublestar

pre-commit:
  parallel: true
  jobs:
    - name: frontend lint (staged)
      root: "ui/" # globs and {staged_files} are relative to root
      glob: "**/*.{ts,tsx,js,jsx,mjs,cjs}"
      run: bunx eslint --fix {staged_files}
      stage_fixed: true

    - name: frontend format (staged)
      root: "ui/"
      glob: "**/*.{ts,tsx,js,jsx,json,md,css}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true

    - name: rust fmt
      glob: "{crates/**/*.rs,src-tauri/**/*.rs,Cargo.toml}"
      run: cargo fmt --all --check

    - name: whitespace
      run: git diff --cached --check

    - name: module layout
      glob: "{crates/**,src-tauri/**}"
      run: python3 .github/scripts/check-module-layout.py

commit-msg:
  jobs:
    - name: commit message
      run: python3 .github/scripts/check-commit-messages.py message {1}

pre-push:
  parallel: true
  jobs:
    - name: check
      # The workspace does not resolve until the sibling Causa path deps are
      # repointed (see AGENTS.md, "The workspace does not resolve today"):
      # cargo metadata fails today. Report that and skip instead of blocking
      # every push; the guard runs again as soon as the rewire lands.
      run: bash -c 'if ! cargo metadata --no-deps --format-version 1 >/dev/null 2>&1; then echo "lefthook - cargo metadata fails (stale ../agent-stack-oss path deps); skipping cargo check until the Causa path-dep rewire"; exit 0; fi; cargo check --workspace --all-targets --locked --exclude reimagine-inference-burn-worker'

    - name: layering
      # Same prerequisite as the check job: cargo metadata must resolve first.
      run: bash -c 'if ! cargo metadata --no-deps --format-version 1 >/dev/null 2>&1; then echo "lefthook - cargo metadata fails (stale ../agent-stack-oss path deps); skipping layering guard until the Causa path-dep rewire"; exit 0; fi; bash .github/scripts/check-dependency-directions.sh'
