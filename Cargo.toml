[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/core",
    "crates/config",
    "crates/model-manager",
    "crates/model-acquisition",
    "crates/nodes",
    "crates/runtime",
    "crates/aigc",
    "crates/app-host",
    "crates/inference",
    "crates/inference-backends/burn",
    "crates/inference-backends/burn-worker",
    "crates/plugin",
    "crates/backend-worker-protocol",
    "crates/backend-worker-host",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
authors = ["Preference"]
description = "Reimagine"
license = "GPL-3.0-or-later"
# A desktop application: no crate is published to a registry.
publish = false


[workspace.dependencies]
tauri = { version = "2", features = [] }
tauri-build = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
safetensors = "0.7"
tokio = "1"
tokio-util = { version = "0.7", features = ["io", "rt"] }
glob-match = "0.2"
sha2 = "0.10"
async-trait = "0.1"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
burn-nn = { version = "0.21", default-features = false, features = ["std"] }
burn-flex = { version = "0.21", default-features = false, features = ["std"] }
burn-wgpu = { version = "0.21", default-features = false, features = ["std"] }
burn-tensor = { version = "0.21", default-features = false, features = ["std"] }
burn-core = { version = "0.21", default-features = false, features = ["std"] }
burn-store = { version = "0.21", default-features = false, features = ["std", "safetensors"] }
burn-cuda = { version = "0.21", default-features = false, features = ["std"] }
burn-rocm = { version = "0.21", default-features = false, features = ["std"] }
tokenizers = "0.21"
image = "0.25"
tempfile = "3"
hf-hub = { version = "1.0.0-rc.1", default-features = false, features = ["rustls-tls", "blocking"] }
ed25519-dalek = "2"
tar = "0.4"
flate2 = "1"
fs2 = "0.4"
hyper-util = "0.1"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
arc-swap = "1"
blake3 = "1"
thiserror = "2"
