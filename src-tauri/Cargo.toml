[package]
name = "reimagine"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "reimagine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
reimagine-agent-harness = { path = "../crates/agent-stack/agent-harness" }
reimagine-app-host = { path = "../crates/app-host" }
reimagine-config = { path = "../crates/config" }
reimagine-core = { path = "../crates/core" }
reimagine-model-acquisition = { path = "../crates/model-acquisition" }
reimagine-runtime = { path = "../crates/runtime" }
reimagine-backend-worker-host = { path = "../crates/backend-worker-host" }
reimagine-backend-worker-protocol = { path = "../crates/backend-worker-protocol" }
tauri = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
opener = "0.7"

[dev-dependencies]
tempfile = { workspace = true }