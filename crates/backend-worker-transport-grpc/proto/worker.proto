syntax = "proto3";
package reimagine.worker.v2;

// The worker contract: five purpose-specific RPCs. There is no message
// tunnel and no per-message session fields; gRPC provides multiplexing,
// deadlines, and cancellation (a cancelled Execute stream tells the
// worker to stop the operation), and `Hello` carries the protocol
// version, identity, and profile exactly once per worker incarnation.
//
// Payloads are JSON bytes whose shapes are defined by the
// `reimagine-inference` serde types; a backend error is a result kind
// (the final Execute event), never a gRPC Status.
service Worker {
  // Identity, instance profile, and protocol version.
  rpc Hello(HelloRequest) returns (HelloResponse);
  // Zero or more Progress events, then exactly one Result event.
  rpc Execute(ExecuteRequest) returns (stream ExecuteEvent);
  // Liveness of the worker process.
  rpc Health(HealthRequest) returns (HealthResponse);
  // Release run-scoped payloads held by the worker.
  rpc Cleanup(CleanupRequest) returns (CleanupResponse);
  // Ask the worker to drain and exit.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
}

message HelloRequest {}

message HelloResponse {
  uint32 protocol_version = 1;
  WorkerIdentity identity = 2;
  WorkerProfile profile = 3;
}

message WorkerIdentity {
  string backend_instance_id = 1;
  string installation_id = 2;
  string incarnation_id = 3;
  string worker_version = 4;
  string backend_kind = 5;
  string target = 6;
  string manifest_digest = 7;
}

message WorkerProfile {
  repeated WorkerInstanceProfile instances = 1;
}

message WorkerInstanceProfile {
  string backend_instance_id = 1;
  string device_label = 2;
  repeated string capabilities = 3;
  bytes operation_options = 4; // JSON-encoded serde_json::Value
}

message ExecuteRequest {
  string operation = 1;
  // JSON-encoded request for `operation`.
  bytes payload = 2;
}

message ExecuteEvent {
  oneof event {
    Progress progress = 1;
    ExecuteResult result = 2; // always the final event of the stream
  }
}

message Progress {
  uint64 sequence = 1;
  uint64 completed = 2;
  optional uint64 total = 3;
  optional string message = 4;
}

message ExecuteResult {
  oneof outcome {
    Success success = 1;
    Cancelled cancelled = 2;
    BackendError backend_error = 3;
  }
}

message Success {
  // JSON-encoded serde_json::Value response for the operation.
  bytes output = 1;
}

message Cancelled {}

message BackendError {
  string code = 1;
  string message = 2;
  bool retryable = 3;
}

message HealthRequest {}

message HealthResponse {
  bool healthy = 1;
  optional string message = 2;
}

message CleanupRequest {
  optional string run_id = 1;
  repeated string object_ids = 2;
}

message CleanupResponse {
  uint64 released_objects = 1;
}

message ShutdownRequest {}

message ShutdownResponse {}
