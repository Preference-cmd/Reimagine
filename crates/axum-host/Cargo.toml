[package]
name = "reimagine-axum-host"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["aigc"]
aigc = ["reimagine-app-host/aigc"]
burn-wgpu = ["aigc", "dep:reimagine-inference-burn", "reimagine-inference-burn/wgpu"]
burn-flex = ["aigc", "dep:reimagine-inference-burn", "reimagine-inference-burn/flex"]
burn-cuda = ["aigc", "dep:reimagine-inference-burn", "reimagine-inference-burn/cuda"]
burn-rocm = ["aigc", "dep:reimagine-inference-burn", "reimagine-inference-burn/rocm"]

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
reimagine-app-host = { path = "../app-host", default-features = false }
reimagine-config = { path = "../config" }
reimagine-inference-burn = { path = "../inference-backends/burn", default-features = false, optional = true }
reimagine-core = { path = "../core" }
reimagine-model-acquisition = { path = "../model-acquisition" }
reimagine-runtime = { path = "../runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
http-body-util = "0.1"
image = { workspace = true }
reimagine-backend-worker-host = { path = "../backend-worker-host" }
reimagine-backend-worker-protocol = { path = "../backend-worker-protocol" }
reimagine-config = { path = "../config" }
reimagine-inference = { path = "../inference" }
reimagine-model-manager = { path = "../model-manager" }
reimagine-nodes = { path = "../nodes" }
safetensors = { workspace = true }
