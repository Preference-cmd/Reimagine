[package]
name = "reimagine-agent-legacy-stack"
version.workspace = true
description = "Frozen harness-shaped provider stack (former ai-protocol / agent-provider frozen faces) — serves agent-harness until Slice 9 harness dissolution"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
reimagine-agent-harness = { path = "../agent-harness" }
reimagine-ai-protocol = { path = "../ai-protocol" }
async-trait = { workspace = true }
base64 = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "fs", "time"] }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
wiremock = "0.6"
