[package]
name = "reimagine-inference-burn-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "reimagine-inference-burn-worker"
path = "src/main.rs"

[lib]
name = "reimagine_inference_burn_worker"
path = "src/lib.rs"

[dependencies]
clap = { workspace = true }
reimagine-backend-worker-protocol = { path = "../../backend-worker-protocol" }
reimagine-backend-worker-transport-grpc = { path = "../../backend-worker-transport-grpc" }
reimagine-core = { path = "../../core" }
reimagine-inference = { path = "../../inference" }
reimagine-inference-burn = { path = "../burn", default-features = false }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "net", "rt", "rt-multi-thread", "macros", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { workspace = true, features = ["rt"] }

[features]
default = ["wgpu"]
wgpu = ["reimagine-inference-burn/wgpu"]
flex = ["reimagine-inference-burn/flex"]
cuda = ["reimagine-inference-burn/cuda"]
rocm = ["reimagine-inference-burn/rocm"]

[dev-dependencies]
image = { workspace = true }
reimagine-app-host = { path = "../../app-host" }
reimagine-backend-worker-host = { path = "../../backend-worker-host" }
reimagine-config = { path = "../../config" }
reimagine-runtime = { path = "../../runtime" }
reimagine-model-manager = { path = "../../model-manager" }
safetensors = { workspace = true }
tempfile = { workspace = true }
