[package]
name = "reimagine-app-host"
version.workspace = true
description.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["aigc"]
aigc = ["dep:aigc"]

[dependencies]
aigc = { path = "../aigc", default-features = false, optional = true }
async-trait = { workspace = true }
chrono = { workspace = true }
hex = { workspace = true }
jsonschema = { workspace = true }
mod-sdk = { path = "../mod-sdk" }
reimagine-backend-worker-host = { path = "../backend-worker-host" }
reimagine-backend-worker-protocol = { path = "../backend-worker-protocol" }
reimagine-config = { path = "../config" }
reimagine-core = { path = "../core" }
reimagine-inference = { path = "../inference" }
reimagine-model-acquisition = { path = "../model-acquisition" }
reimagine-model-manager = { path = "../model-manager" }
reimagine-nodes = { path = "../nodes" }
reimagine-runtime = { path = "../runtime" }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
chrono = { workspace = true }
image = { workspace = true }
mod-sdk = { path = "../mod-sdk", features = ["testing"] }
safetensors = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "rt-multi-thread"] }
