[package]
name = "reimagine-backend-worker-transport-quic"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
async-trait = { workspace = true }
quinn = { version = "0.11", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rcgen = "0.13"
reimagine-backend-worker-protocol = { path = "../backend-worker-protocol" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
